name: CI - Code Validation
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  validate:
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
 
    - name: Validate HTML structure
      run: |
        echo "Checking HTML file existence..."
        test -f index.html && echo "✓ index.html exists" || exit 1
 
    - name: Validate CSS file
      run: |
        echo "Checking CSS file existence..."
        test -f style.css && echo "✓ style.css exists" || exit 1
 
    - name: Validate JavaScript file
      run: |
        echo "Checking JS file existence..."
        test -f script.js && echo "✓ script.js exists" || exit 1
 
    - name: Basic content check
      run: |
        echo "Checking that files are not empty..."
        test -s index.html && echo "✓ index.html is not empty" || exit 1
        test -s style.css && echo "✓ style.css is not empty" || exit 1
        test -s script.js && echo "✓ script.js is not empty" || exit 1
        echo "All basic validations passed! 🎉"
